name: AI LinkedIn Poster

on:
  schedule:
    - cron: "30 3 * * *" # Runs daily at 03:30 UTC (9:00 AM IST)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not post, just preview)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run poster
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
          LINKEDIN_AUTHOR: ${{ secrets.LINKEDIN_AUTHOR }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GEMINI_MODELS: "gemini-3.8-flash,gemini-1.5-flash"
          # On scheduled runs, dry_run input is empty → defaults to false (live post)
          # On manual runs, use whatever the user chose
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python post.py
        
      - name: Archive preview artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview
          path: |
            preview.txt
            image.jpg
            
      - name: Commit posted.json
        # Commit when scheduled (no inputs) OR when manually run with dry_run=false
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update posted.json" && git push)

